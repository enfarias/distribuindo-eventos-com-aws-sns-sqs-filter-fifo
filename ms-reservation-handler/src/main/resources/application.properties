server.port=8082
spring.application.name=ms-reservation-handler

# Fila de origem e topico de destino, parametrizados via env
app.queue.reservation=${RESERVATION_QUEUE_NAME:sqs-poc-reservation-queue.fifo}
app.topic.ticket-events=${TICKET_EVENTS_TOPIC:sns-poc-ticket-events.fifo}

# Regiao AWS (credenciais vem da IAM Task Role do ECS em runtime)
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# ============================================================================
# Spring Cloud AWS, SQS Listener
# ============================================================================
spring.cloud.aws.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:10}
spring.cloud.aws.sqs.listener.poll-timeout=${SQS_WAIT_TIME_SECONDS:20}s
spring.cloud.aws.sqs.listener.max-concurrent-messages=10

# Banco H2 em memoria (mesmo padrao do projeto base)
spring.datasource.url=jdbc:h2:mem:reservationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Console H2 desabilitado em producao
spring.h2.console.enabled=false

# Actuator (health para liveness/readiness do ECS)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Padrao de log com MDC do correlation-id
logging.pattern.level=%5p [%X{correlationId:-}]
