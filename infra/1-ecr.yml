Outputs:
  AccountId:
    Description: AWS Account ID
    Value: !Ref AWS::AccountId
  IngestorRepositoryName:
    Description: Nome do repositorio ECR do ingestor
    Value: !Ref IngestorRepository
  IngestorRepositoryUri:
    Description: URI do repositorio ECR do ingestor
    Value: !GetAtt IngestorRepository.RepositoryUri
  ReservationHandlerRepositoryName:
    Description: Nome do repositorio ECR do reservation-handler
    Value: !Ref ReservationHandlerRepository
  ReservationHandlerRepositoryUri:
    Description: URI do repositorio ECR do reservation-handler
    Value: !GetAtt ReservationHandlerRepository.RepositoryUri
  NotificationRepositoryName:
    Description: Nome do repositorio ECR do notification
    Value: !Ref NotificationRepository
  NotificationRepositoryUri:
