AWSTemplateFormatVersion: '2010-09-09'
Description: ECR Repositories para distribuindo-eventos-com-aws-sns-sqs (ingestor, reservation-handler, notification, fulfillment, vip-handler)

Resources:
  IngestorRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ms-poc-ingestor
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep last 5 tagged images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
                "action": { "type": "expire" }
              }
            ]
          }

  ReservationHandlerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ms-poc-reservation-handler
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
