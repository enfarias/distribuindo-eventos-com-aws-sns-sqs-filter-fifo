    Value: !GetAtt NotificationRepository.RepositoryUri
  FulfillmentRepositoryName:
    Description: Nome do repositorio ECR do fulfillment
    Value: !Ref FulfillmentRepository
  FulfillmentRepositoryUri:
    Description: URI do repositorio ECR do fulfillment
    Value: !GetAtt FulfillmentRepository.RepositoryUri
  VipHandlerRepositoryName:
