server.port=8081
spring.application.name=ms-payment-ingestor

# Fila de destino, parametrizada via env
app.queue.reservation=${RESERVATION_QUEUE_NAME:sqs-poc-reservation-queue.fifo}

# Regiao AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Actuator (health check exposto para o ALB)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Padrao de log com MDC do correlation-id
logging.pattern.level=%5p [%X{correlationId:-}]
